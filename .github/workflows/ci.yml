name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint-test:
    name: Lint + agent unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r agent/requirements.txt ruff pytest
      - name: Ruff lint
        run: ruff check agent tests pipeline
      - name: Pytest (agent)
        run: pytest tests/ -v

  dbt:
    name: dbt build (DuckDB, fixture data)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dbt-duckdb
        run: pip install dbt-duckdb==1.9.1 duckdb==1.1.3
      - name: Generate fixture landing data
        run: python pipeline/tests/make_fixture.py
      - name: dbt build (models + tests)
        working-directory: pipeline
        run: dbt build --profiles-dir .

  build-validate:
    name: Docker build + kustomize validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build agent image
        run: docker build -t edge-sensor-platform/agent:ci agent/
      - name: Build pipeline image
        run: docker build -t edge-sensor-platform/pipeline:ci pipeline/
      - name: Install kustomize
        run: |
          curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
          sudo mv kustomize /usr/local/bin/
      - name: Validate k8s manifests render
        run: kustomize build k8s > /dev/null

  terraform:
    name: Terraform validate + fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: Format check
        run: terraform -chdir=terraform fmt -check -recursive
      - name: Validate
        run: |
          terraform -chdir=terraform init -backend=false
          terraform -chdir=terraform validate
