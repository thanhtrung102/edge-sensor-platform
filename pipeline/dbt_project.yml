name: edge_pipeline
version: "1.0.0"
config-version: 2

profile: edge_pipeline

model-paths: ["models"]
seed-paths: ["seeds"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

vars:
  # capture cadence the edge agents are configured for (CAPTURE_FPS in the agent)
  expected_fps: 2
  # anomaly thresholds: a reading is flagged if it deviates this many robust-stddevs
  # from the per-sensor median, or exceeds the hard physical ceiling.
  anomaly_sigma: 4

models:
  edge_pipeline:
    staging:
      +materialized: view
    marts:
      +materialized: table
