# Prometheus with in-cluster pod discovery. Scrapes every pod annotated
# prometheus.io/scrape=true (the edge-agent DaemonSet pods). Alert rules are identical to
# the Docker/native stack. On EKS this maps to AMP (Amazon Managed Prometheus) or the
# kube-prometheus-stack chart.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: edge
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: prometheus-edge
rules:
  - apiGroups: [""]
    resources: ["nodes", "services", "endpoints", "pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: prometheus-edge
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: prometheus-edge
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: edge
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: edge
data:
  prometheus.yml: |
    global:
      scrape_interval: 5s
      evaluation_interval: 5s
    rule_files:
      - /etc/prometheus/alerts.yml
    scrape_configs:
      - job_name: edge-agents
        kubernetes_sd_configs:
          - role: pod
            namespaces: { names: [edge] }
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: "true"
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__
          - source_labels: [__meta_kubernetes_pod_node_name]
            target_label: node
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
      - job_name: prometheus
        static_configs:
          - targets: ["localhost:9090"]
  alerts.yml: |
    groups:
      - name: edge-fleet
        rules:
          - alert: EdgeCaptureStalled
            expr: time() - edge_last_capture_timestamp_seconds > 30
            for: 15s
            labels: { severity: critical }
            annotations:
              summary: "Capture stalled on {{ $labels.device_id }}"
              description: "No frame captured for >30s — check the camera/agent on site {{ $labels.site }}."
          - alert: EdgeUploadBacklogHigh
            expr: edge_upload_backlog_files > 50
            for: 30s
            labels: { severity: warning }
            annotations:
              summary: "Upload backlog high on {{ $labels.device_id }}"
              description: "{{ $value }} files buffered locally — object store unreachable or slow; escalate."
          - alert: EdgeSensorAnomalyBurst
            expr: increase(edge_sensor_anomaly_total[1m]) > 5
            for: 0s
            labels: { severity: warning }
            annotations:
              summary: "Sensor anomaly burst on {{ $labels.device_id }} ({{ $labels.sensor }})"
              description: "More than 5 anomalies in the last minute."
          - alert: EdgeAgentDown
            expr: up{job="edge-agents"} == 0
            for: 20s
            labels: { severity: critical }
            annotations:
              summary: "Edge agent unreachable"
              description: "Prometheus cannot scrape the agent — device offline or crashed."
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: edge
spec:
  replicas: 1
  selector:
    matchLabels: { app: prometheus }
  template:
    metadata:
      labels: { app: prometheus }
    spec:
      serviceAccountName: prometheus
      containers:
        - name: prometheus
          image: prom/prometheus:v3.0.1
          args:
            - --config.file=/etc/prometheus/prometheus.yml
          ports:
            - { containerPort: 9090 }
          volumeMounts:
            - { name: config, mountPath: /etc/prometheus }
      volumes:
        - name: config
          configMap: { name: prometheus-config }
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: edge
spec:
  selector: { app: prometheus }
  ports:
    - { port: 9090, targetPort: 9090 }
