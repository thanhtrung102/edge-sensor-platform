# Edge agent as a DaemonSet: exactly one capture agent per node, the way a fleet runs one
# agent per physical edge box. DEVICE_ID is derived from the node name via the downward API.
# Pods are annotated for Prometheus pod-discovery scraping.
apiVersion: v1
kind: ConfigMap
metadata:
  name: agent-config
  namespace: edge
data:
  CAPTURE_FPS: "2"
  CAMERA_SOURCE: synthetic        # set to "webcam" + mount /dev/video0 on real edge nodes
  S3_ENDPOINT: http://minio:9000
  S3_BUCKET: edge-data
  ANOMALY_RATE: "0.03"
  BUFFER_DIR: /data/buffer
  MAX_BUFFER_BYTES: "536870912"   # 512 MiB store-and-forward cap (drop-oldest beyond this)
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: edge-agent
  namespace: edge
spec:
  selector:
    matchLabels: { app: edge-agent }
  template:
    metadata:
      labels: { app: edge-agent }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: agent
          # build locally: docker build -t edge-sensor-platform/agent:latest agent/
          # k3s import:    k3s ctr images import <(docker save edge-sensor-platform/agent:latest)
          image: edge-sensor-platform/agent:latest
          imagePullPolicy: IfNotPresent
          ports:
            - { containerPort: 8000, name: http }
          envFrom:
            - configMapRef: { name: agent-config }
          env:
            - name: DEVICE_ID
              valueFrom: { fieldRef: { fieldPath: spec.nodeName } }
            - name: SITE
              valueFrom: { fieldRef: { fieldPath: metadata.namespace } }
            - name: S3_ACCESS_KEY
              valueFrom: { secretKeyRef: { name: object-store, key: access-key } }
            - name: S3_SECRET_KEY
              valueFrom: { secretKeyRef: { name: object-store, key: secret-key } }
          readinessProbe:
            httpGet: { path: /healthz, port: 8000 }
            initialDelaySeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: 8000 }
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests: { cpu: 50m, memory: 96Mi }
            limits: { cpu: "500m", memory: 256Mi }
          volumeMounts:
            - { name: buffer, mountPath: /data/buffer }
      volumes:
        # emptyDir keeps the offline buffer node-local; swap for a hostPath on real edge
        # hardware so buffered captures survive a pod restart.
        - name: buffer
          emptyDir: { sizeLimit: 1Gi }
---
apiVersion: v1
kind: Service
metadata:
  name: edge-agent
  namespace: edge
  labels: { app: edge-agent }
spec:
  clusterIP: None        # headless: one endpoint per agent pod
  selector: { app: edge-agent }
  ports:
    - { name: http, port: 8000, targetPort: 8000 }
