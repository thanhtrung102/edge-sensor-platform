# Scheduled analytics: every 15 min, land raw objects from the object store and rebuild the
# dbt marts. On EKS this is the same pattern as an EventBridge-scheduled Glue/dbt job.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: edge-pipeline
  namespace: edge
spec:
  schedule: "*/15 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: pipeline
              # build locally: docker build -t edge-sensor-platform/pipeline:latest pipeline/
              image: edge-sensor-platform/pipeline:latest
              imagePullPolicy: IfNotPresent
              env:
                - { name: S3_ENDPOINT, value: http://minio:9000 }
                - { name: S3_BUCKET, value: edge-data }
                - name: S3_ACCESS_KEY
                  valueFrom: { secretKeyRef: { name: object-store, key: access-key } }
                - name: S3_SECRET_KEY
                  valueFrom: { secretKeyRef: { name: object-store, key: secret-key } }
              resources:
                requests: { cpu: 100m, memory: 256Mi }
                limits: { cpu: "1", memory: 1Gi }
